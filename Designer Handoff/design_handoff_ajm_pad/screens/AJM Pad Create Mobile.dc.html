<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; background: #14161b; }
  a { color: #5eead4; text-decoration: none; }
  a:hover { color: #99f6e4; }
  ::selection { background: #5eead4; color: #04120e; }
  .noscroll::-webkit-scrollbar { display: none; }
</style>
</helmet>
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px; background:radial-gradient(900px 500px at 50% 0%, #1b1e26, #0d0e12);">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="true" hint-size="402px,874px">

    <div style="height:100%; display:flex; flex-direction:column; background:#090b0f; color:#e9edf3; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif; font-size:15px;">

      <div class="noscroll" style="flex:1; overflow-y:auto; overflow-x:hidden;">

        <!-- sticky top bar -->
        <div style="position:sticky; top:0; z-index:10; background:rgba(9,11,15,0.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid #12161e; padding:52px 16px 12px; display:flex; align-items:center; gap:12px;">
          <a href="AJM Pad Home Mobile.dc.html" style="color:#aab2c0; display:flex; align-items:center;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
          </a>
          <span style="font-weight:700; font-size:16px;">create a new coin</span>
        </div>

        <div style="padding:18px 16px 24px; display:flex; flex-direction:column; gap:18px;">

          <!-- form -->
          <div style="background:#0d1017; border:1px solid #171c25; padding:18px;">
            <label style="display:block; font-size:12.5px; color:#9aa3b2; margin-bottom:7px; font-weight:600;">name</label>
            <input value="{{ name }}" onInput="{{ setName }}" placeholder="Doge Classic" style="width:100%; box-sizing:border-box; background:#0e1219; border:1px solid #232a37; color:#e9edf3; padding:12px 14px; font-size:15px; outline:none; margin-bottom:16px;" style-focus="border-color:#5eead4;">

            <label style="display:block; font-size:12.5px; color:#9aa3b2; margin-bottom:7px; font-weight:600;">ticker</label>
            <div style="position:relative; margin-bottom:16px;">
              <span style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#5eead4; font-weight:700;">$</span>
              <input value="{{ symbol }}" onInput="{{ setSymbol }}" maxlength="11" placeholder="DOGEC" style="width:100%; box-sizing:border-box; background:#0e1219; border:1px solid #232a37; color:#e9edf3; padding:12px 14px 12px 28px; font-size:15px; outline:none; text-transform:uppercase;" style-focus="border-color:#5eead4;">
            </div>

            <label style="display:block; font-size:12.5px; color:#9aa3b2; margin-bottom:7px; font-weight:600;">image url <span style="color:#4b535f; font-weight:400;">(optional)</span></label>
            <input value="{{ image }}" onInput="{{ setImage }}" placeholder="https://…/logo.png" style="width:100%; box-sizing:border-box; background:#0e1219; border:1px solid #232a37; color:#e9edf3; padding:12px 14px; font-size:15px; outline:none; margin-bottom:14px;" style-focus="border-color:#5eead4;">

            <div onClick="{{ toggleMore }}" style="font-size:13px; color:#5eead4; cursor:pointer; padding:4px 0 6px; display:inline-flex; align-items:center; gap:6px;">show more options <span style="font-size:11px;">{{ moreChevron }}</span></div>

            <sc-if value="{{ showMore }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex; flex-direction:column; gap:12px; margin:10px 0 4px; padding:14px; background:#0a0d12; border:1px solid #171c25;">
                <div>
                  <label style="display:block; font-size:12px; color:#9aa3b2; margin-bottom:6px;">X / Twitter</label>
                  <input placeholder="https://x.com/…" style="width:100%; box-sizing:border-box; background:#0e1219; border:1px solid #232a37; color:#e9edf3; padding:10px 12px; font-size:14px; outline:none;" style-focus="border-color:#5eead4;">
                </div>
                <div>
                  <label style="display:block; font-size:12px; color:#9aa3b2; margin-bottom:6px;">Telegram</label>
                  <input placeholder="https://t.me/…" style="width:100%; box-sizing:border-box; background:#0e1219; border:1px solid #232a37; color:#e9edf3; padding:10px 12px; font-size:14px; outline:none;" style-focus="border-color:#5eead4;">
                </div>
                <div>
                  <label style="display:block; font-size:12px; color:#9aa3b2; margin-bottom:6px;">Website</label>
                  <input placeholder="https://…" style="width:100%; box-sizing:border-box; background:#0e1219; border:1px solid #232a37; color:#e9edf3; padding:10px 12px; font-size:14px; outline:none;" style-focus="border-color:#5eead4;">
                </div>
              </div>
            </sc-if>

            <div style="border-top:1px solid #171c25; margin:18px 0 14px; padding-top:16px;">
              <label style="display:block; font-size:12.5px; color:#9aa3b2; margin-bottom:7px; font-weight:600;">buy a little of your own coin <span style="color:#4b535f; font-weight:400;">(optional)</span></label>
              <div style="position:relative;">
                <input value="{{ devBuy }}" onInput="{{ setDevBuy }}" placeholder="0.0" style="width:100%; box-sizing:border-box; background:#0e1219; border:1px solid #232a37; color:#e9edf3; padding:12px 54px 12px 14px; font-size:15px; outline:none;" style-focus="border-color:#5eead4;">
                <span style="position:absolute; right:14px; top:50%; transform:translateY(-50%); color:#7b8494; font-size:13px; font-weight:600;">ETH</span>
              </div>
            </div>

            <button style="width:100%; background:#2dd4bf; color:#05130c; border:none; padding:14px; font-weight:700; font-size:16px; cursor:pointer; margin-top:4px;" style-active="filter:brightness(1.06);">launch coin</button>
          </div>

          <!-- live preview -->
          <div>
            <div style="font-size:12px; color:#7b8494; margin-bottom:10px; font-weight:600; text-transform:uppercase; letter-spacing:1px;">preview</div>
            <div style="background:#0d1017; border:1px solid #171c25; padding:14px; display:flex; gap:14px; align-items:flex-start;">
              <sc-if value="{{ hasImage }}" hint-placeholder-val="{{ false }}">
                {{ previewImg }}
              </sc-if>
              <sc-if value="{{ noImage }}" hint-placeholder-val="{{ true }}">
                <div style="width:96px; height:96px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; background:#0e1219; border:1px dashed #2a3240; color:#4b535f;">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="8.5" cy="9" r="1.7"></circle><path d="M4 17l5-5 4 4 3-3 4 4"></path></svg>
                  <span style="font-size:10px; letter-spacing:0.5px;">image</span>
                </div>
              </sc-if>
              <div style="min-width:0; flex:1;">
                <div style="display:flex; align-items:center; gap:6px; font-size:12px;">
                  <span style="color:#7b8494;">by</span>
                  <span style="width:15px; height:15px; border-radius:50%; display:inline-block; background:#2dd4bf;"></span>
                  <span style="color:#aab2c0;">you</span>
                  <span style="color:#7b8494; margin-left:auto;">just now</span>
                </div>
                <div style="display:flex; align-items:center; gap:12px; margin-top:8px; font-size:12px;">
                  <span><span style="color:#7b8494;">mcap </span><span style="color:#5eead4; font-weight:700;">$1.2K</span></span>
                  <span style="color:#7b8494;">0 replies</span>
                </div>
                <div style="font-size:13px; margin-top:9px; line-height:1.45;"><span style="font-weight:700; color:#e9edf3;">{{ previewName }} ({{ previewTicker }}):</span> <span style="color:#7b8494;">your coin, live on a locked pool.</span></div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- sticky bottom tab bar -->
      <div style="position:sticky; bottom:0; z-index:20; display:flex; background:rgba(9,11,15,0.94); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid #171c25; padding:10px 8px 26px;">
        <a href="AJM Pad Home Mobile.dc.html" style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:#6b7482; font-size:10.5px; font-weight:600;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h14V10"></path></svg>
          <span>home</span>
        </a>
        <a href="AJM Pad Home Mobile.dc.html" style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:#6b7482; font-size:10.5px; font-weight:600;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.2-3.2"></path></svg>
          <span>search</span>
        </a>
        <a href="#" style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:#5eead4; font-size:10.5px; font-weight:600;">
          <span style="width:26px; height:26px; display:flex; align-items:center; justify-content:center; background:#2dd4bf; color:#05130c;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </span>
          <span>create</span>
        </a>
        <a href="AJM Pad Profile Mobile.dc.html" style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:#6b7482; font-size:10.5px; font-weight:600;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.2"></circle><circle cx="12" cy="9.5" r="3"></circle><path d="M6 19a6 6 0 0112 0"></path></svg>
          <span>profile</span>
        </a>
      </div>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 470, &quot;height&quot;: 940}}">
class Component extends DCLogic {
  state = { name: "", symbol: "", image: "", devBuy: "", showMore: false };

  renderVals() {
    const img = this.state.image.trim();
    const hasImage = img.length > 0;
    return {
      name: this.state.name,
      symbol: this.state.symbol,
      image: img,
      previewImg: hasImage ? React.createElement("img", { src: img, style: { width: "96px", height: "96px", objectFit: "cover", flexShrink: 0, background: "#0e1219" } }) : null,
      devBuy: this.state.devBuy,
      showMore: this.state.showMore,
      hasImage,
      noImage: !hasImage,
      moreChevron: this.state.showMore ? "\u25B4" : "\u25BE",
      previewName: this.state.name.trim() || "Your Coin",
      previewTicker: (this.state.symbol.trim() || "TICKER").toUpperCase(),
      setName:   (e) => this.setState({ name: e.target.value }),
      setSymbol: (e) => this.setState({ symbol: e.target.value }),
      setImage:  (e) => this.setState({ image: e.target.value }),
      setDevBuy: (e) => this.setState({ devBuy: e.target.value }),
      toggleMore: () => this.setState(s => ({ showMore: !s.showMore })),
    };
  }
}
</script>
</body>
</html>
